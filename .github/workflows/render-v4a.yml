name: Render StudyGrid V4A

on:
  push:
    branches: [main]
    paths:
      - "blender/**"
      - ".github/workflows/render-v4a.yml"
  workflow_dispatch:
    inputs:
      quality:
        description: Render quality
        type: choice
        required: true
        default: preview
        options:
          - preview
          - review

permissions:
  contents: read

concurrency:
  group: studygrid-v4a-render
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.5.14"
  BLENDER_DIR: ${{ github.workspace }}/.tools/blender-4.5.14-linux-x64
  SG_QUALITY: ${{ inputs.quality || 'preview' }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Blender 4.5.14 LTS
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: .tools/blender-4.5.14-linux-x64
          key: blender-4.5.14-linux-x64

      - name: Install Blender 4.5.14 LTS
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .tools
          cd .tools
          FILE="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl --fail --location --retry 3 \
            --output "$FILE" \
            "https://download.blender.org/release/Blender4.5/$FILE"
          curl --fail --location --retry 3 \
            --output "blender-${BLENDER_VERSION}.sha256" \
            "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}.sha256"
          grep " $FILE$" "blender-${BLENDER_VERSION}.sha256" | sha256sum --check --strict -
          tar -xf "$FILE"
          rm -f "$FILE" "blender-${BLENDER_VERSION}.sha256"

      - name: Install headless render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libx11-6 libxext6 libxrender1 libxi6 libxkbcommon0

      - name: Verify render tools
        run: |
          set -euo pipefail
          "$BLENDER_DIR/blender" --version | head -n 2
          ffmpeg -version | head -n 1
          ldconfig -p | grep 'libEGL.so.1' | head -n 1

      - name: Prepare bounded owner-QA preview source
        run: |
          set -euo pipefail
          mkdir -p output
          cp blender/scene_v4a.py output/scene_v4a_runtime.py
          if [ "$SG_QUALITY" = "preview" ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("output/scene_v4a_runtime.py")
          s = p.read_text(encoding="utf-8")
          old_fps = 'FPS = 12 if ARGS["quality"] == "preview" else 30'
          new_fps = 'FPS = 8 if ARGS["quality"] == "preview" else 30'
          if old_fps not in s:
              raise SystemExit("Expected preview FPS source line not found")
          s = s.replace(old_fps, new_fps, 1)
          engine_line = 'scene.render.engine = "BLENDER_EEVEE_NEXT"'
          sample_line = 'scene.eevee.taa_render_samples = 8 if ARGS["quality"] == "preview" else 64'
          if engine_line not in s:
              raise SystemExit("Expected EEVEE engine source line not found")
          s = s.replace(engine_line, engine_line + "\n" + sample_line, 1)
          p.write_text(s, encoding="utf-8")
          PY
          fi
          sha256sum output/scene_v4a_runtime.py > output/runtime_source_sha256.txt
          cat output/runtime_source_sha256.txt

      - name: Build and render V4A
        run: |
          set -euo pipefail
          "$BLENDER_DIR/blender" --background --factory-startup \
            --python-exit-code 1 \
            --python output/scene_v4a_runtime.py \
            -- \
            --output-dir "$GITHUB_WORKSPACE/output" \
            --quality "$SG_QUALITY"

      - name: Encode preview MP4
        run: |
          set -euo pipefail
          FPS=8
          if [ "$SG_QUALITY" = "review" ]; then FPS=30; fi
          ffmpeg -y \
            -framerate "$FPS" \
            -start_number 1 \
            -i output/frames/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -crf 20 \
            -movflags +faststart \
            output/studygrid-v4a-preview.mp4

      - name: Upload owner-QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studygrid-v4a-owner-qa
          path: |
            output/studygrid-v4a-preview.mp4
            output/stills/*.png
            output/studygrid-v4a.blend
            output/qa_manifest.txt
            output/scene_v4a_runtime.py
            output/runtime_source_sha256.txt
          retention-days: 3
          if-no-files-found: error
